<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Превью спрайтов</title>
<style>
body{margin:0;padding:16px;background:#e9e0d2;font:14px system-ui,sans-serif;color:#222}
h1{font-size:20px;margin:0 0 12px}
.grid{display:flex;flex-wrap:wrap;gap:14px}
.card{background:#f6f0e6;border-radius:10px;padding:10px;text-align:center;width:200px}
canvas{image-rendering:pixelated;width:192px;height:192px}
.n{font-weight:600}.d{font-size:12px;color:#666;min-height:32px}
#empty{color:#666}
</style></head><body>
<h1 id="t">Превью спрайтов</h1>
<div class="grid" id="g"></div>
<p id="empty" hidden>Нет out/manifest.json — сначала сгенерируйте анимации через pixelkit.export(...).</p>
<script>
fetch('out/manifest.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(m=>{
  const FW=m.frameWidth, FH=m.frameHeight;
  document.getElementById('t').textContent=`${m.name}: анимации (кадр ${FW}×${FH})`;
  const img=new Image(); img.src='out/'+m.atlas;
  img.onload=()=>{
    for(const [name,a] of Object.entries(m.animations)){
      const c=document.createElement('div'); c.className='card';
      c.innerHTML=`<div class="n"></div><canvas width="${FW}" height="${FH}"></canvas><div class="d"></div><button>▶ заново</button>`;
      c.querySelector('.n').textContent=name; c.querySelector('.d').textContent=a.description||'';
      document.getElementById('g').append(c);
      const ctx=c.querySelector('canvas').getContext('2d');
      let t0=performance.now();
      c.querySelector('button').onclick=()=>{t0=performance.now()};
      const fps=a.fps||4;
      (function loop(now){
        const i=Math.floor((now-t0)/1000*fps);
        const f=a.loop? i%a.frames : Math.min(i,a.frames-1);
        if(!a.loop && i>a.frames+fps*1.5) t0=now;
        ctx.clearRect(0,0,FW,FH); ctx.drawImage(img,f*FW,a.row*FH,FW,FH,0,0,FW,FH);
        requestAnimationFrame(loop)})(t0);
    }
  };
}).catch(()=>{document.getElementById('empty').hidden=false});
</script></body></html>
