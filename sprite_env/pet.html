<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Питомец</title>
<style>
:root{--bg:#e9e0d2;--panel:#f6f0e6;--ink:#222;--muted:#6b6257;--accent:#8c1d2c}
body{margin:0;background:var(--bg);font:14px system-ui,sans-serif;color:var(--ink)}
#stage{position:relative;height:360px;overflow:hidden;background:linear-gradient(#f3ece1 0 78%,#d9cbb6 78%);cursor:pointer}
#pet{position:absolute;bottom:20px;width:192px;height:192px;image-rendering:pixelated}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px}
button{font:inherit;border:1px solid #cbbda8;background:var(--panel);border-radius:8px;padding:6px 10px;cursor:pointer}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#st{padding:0 16px 16px;color:var(--muted)}
label{display:flex;align-items:center;gap:6px;padding:6px 4px}
</style></head><body>
<div id="stage"><canvas id="pet"></canvas></div>
<div class="bar" id="bar"></div>
<div class="bar"><label><input type="checkbox" id="auto" checked> сам по себе</label>
<label><input type="checkbox" id="eyes" checked> следит за курсором</label></div>
<div id="st"></div>
<script>
const $=id=>document.getElementById(id);
const stage=$('stage'), cv=$('pet'), ctx=cv.getContext('2d');
const BUTTONS={idle:'Покой',wave:'Привет',jump:'Прыжок',fail:'Неудача',wait:'Ожидание',eat:'Ест рыбку',
  toss_fish:'Подбросить рыбку',fish_hug:'Обнять рыбку',inspect:'Проверка',run:'Перебежка',fly:'Полёт',look:'Взгляд по кругу'};
let M,img,anim='idle',t0=0,x=0,dir=1,target=null,queue=[],mouse=null,lockLook=false;

fetch('out/manifest.json').then(r=>r.json()).then(m=>{
  M=m; cv.width=m.frameWidth; cv.height=m.frameHeight;
  img=new Image(); img.src='out/'+m.atlas; img.onload=start;
});

function play(name,{then}={}){anim=name;t0=performance.now();queue=then?[...then]:[];status();}
function status(){$('st').textContent='Сейчас: '+(M.animations[anim]?.description||anim);
  document.querySelectorAll('#bar button').forEach(b=>b.classList.toggle('on',b.dataset.a===anim||(b.dataset.a==='run'&&anim.startsWith('run'))||(b.dataset.a==='fly'&&/fly|hover|takeoff|land/.test(anim))));}

function act(a){
  if(a==='toss_fish'){target=null;play('toss_fish',{then:['fish_hug','fish_hug','idle']});status();return}
  target=null;
  if(a==='run'){runTo(Math.random()*(stage.clientWidth-cv.clientWidth));return}
  if(a==='fly'){flyTo(Math.random()*(stage.clientWidth-cv.clientWidth));return}
  if(a==='look'){lockLook=true;play('look',{then:['idle']});return}
  play(a,{then:['idle']});
}
function runTo(tx){target={x:tx,speed:150,kind:'run'};dir=tx>x?1:-1;play(dir>0?'run_right':'run_left');}
function flyTo(tx){target=null;play('takeoff',{then:[()=>{target={x:tx,speed:200,kind:'fly'};dir=tx>x?1:-1;play(dir>0?'fly_right':'fly_left')}]});}

function next(){
  const n=queue.shift(); lockLook=false;
  if(typeof n==='function') n(); else play(n||'idle');
}

function start(){
  x=(stage.clientWidth-cv.clientWidth)/2;
  for(const [k,v] of Object.entries(BUTTONS)){const b=document.createElement('button');b.textContent=v;b.dataset.a=k;b.onclick=()=>act(k);$('bar').append(b)}
  stage.onclick=e=>{const r=cv.getBoundingClientRect();
    if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom) act('wave');
    else runTo(Math.max(0,Math.min(stage.clientWidth-cv.clientWidth,e.clientX-stage.getBoundingClientRect().left-cv.clientWidth/2)));};
  stage.onmousemove=e=>{mouse={x:e.clientX,y:e.clientY,t:performance.now()}};
  stage.onmouseleave=()=>mouse=null;
  play('idle'); requestAnimationFrame(loop);
}

let last=performance.now(), nextAuto=performance.now()+4000;
const AUTO=['wave','jump','fail','wait','eat','toss_fish','toss_fish','inspect','run','run','fly','idle','idle'];
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  const a=M.animations[anim];
  let i=Math.floor((now-t0)/1000*a.fps), f;
  // движение по сцене
  if(target){
    const step=target.speed*dt*Math.sign(target.x-x);
    if(Math.abs(target.x-x)<=Math.abs(step)){x=target.x;const k=target.kind;target=null;
      if(k==='fly') play('land',{then:['idle']}); else play('idle');}
    else x+=step;
  }
  if(a.loop) f=i%a.frames;
  else if(i>=a.frames){next(); f=0; return requestAnimationFrame(loop)}
  else f=i;
  // взгляд за курсором в покое: 16 направлений, по часовой стрелке от «вверх»
  let row=a.row;
  if(anim==='idle'&&!lockLook&&$('eyes').checked&&mouse&&now-mouse.t<2500){
    const r=cv.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height*.45;
    const ang=(Math.atan2(mouse.x-cx,-(mouse.y-cy))+2*Math.PI)%(2*Math.PI);
    row=M.animations.look.row; f=Math.round(ang/(Math.PI/8))%16;
  }
  // самостоятельное поведение
  if($('auto').checked&&anim==='idle'&&!target&&now>nextAuto&&!(mouse&&now-mouse.t<2500)){
    act(AUTO[Math.floor(Math.random()*AUTO.length)]); nextAuto=now+4000+Math.random()*5000;
  }
  if(anim!=='idle') nextAuto=Math.max(nextAuto,now+3000);
  cv.style.left=x+'px';
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(img,f*M.frameWidth,row*M.frameHeight,M.frameWidth,M.frameHeight,0,0,M.frameWidth,M.frameHeight);
  requestAnimationFrame(loop);
}
</script></body></html>
